# Dependabot opens PRs that update our dependencies, monthly, grouped to keep them few.
# Security fixes come sooner, as their own PRs (turned on in the repo's settings).
# The title decides the release (docs/completed/15-auto-release.md): what ships is
# fix(deps), so merging it releases. Dev tools and CI are chore and ci, so they don't.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: fix(deps)
      prefix-development: chore(deps)
    # Tauri's npm package and Rust crate must match, so we update them together by hand.
    # Listing update-types skips only version updates. A bare ignore would block security
    # fixes too.
    ignore:
      - dependency-name: "@tauri-apps/*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      # Its types follow the Node version we run (.nvmrc), so a new major waits for that.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]

  # The Mac app. Merging one also builds a new Mac release.
  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: fix(deps)
    # Tauri, by hand, as above.
    ignore:
      - dependency-name: "tauri"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: "tauri-build"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: "tauri-plugin-*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      desktop:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directories: [/, /.github/actions/setup]
    schedule:
      interval: monthly
    commit-message:
      prefix: ci(deps)
    # It builds the Mac release, which only a real release can test. Majors by hand.
    ignore:
      - dependency-name: "tauri-apps/tauri-action"
        update-types:
          - version-update:semver-major
    groups:
      actions:
        update-types: [minor, patch]
