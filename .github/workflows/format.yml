name: Format

# Its own workflow, so a failure shows by name on the PR.
on:
  pull_request:
  # release.yml runs it on main, before releasing.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Prisma's config needs a value to generate the client on install.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Check formatting
        run: |
          if ! pnpm format:check; then
            echo "::error::Some files aren't formatted. Run 'pnpm format' and commit the result."
            exit 1
          fi
