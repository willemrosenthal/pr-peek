name: Lint

# Its own workflow, so a failure shows by name on the PR.
on:
  pull_request:
  # release.yml runs it on main, before releasing.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Prisma's config needs a value to generate the client on install.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint
      # Checks the workflow files themselves. A broken release.yml would otherwise only
      # show up on main, after merging.
      - run: pnpm lint:workflows
