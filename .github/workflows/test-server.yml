name: Test server

on:
  pull_request:
  # release.yml runs it on main, before releasing.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: test-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-server:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      # For tests that use a real database. The test setup creates the test database in it.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      # Prisma's config needs a value to generate the client.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test:server
