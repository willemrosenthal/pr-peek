name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Pinned, since ubuntu-latest is moving to 26.04. 24.04 has what Chromium needs.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      # For tests that use a real database. The test setup creates the test database in it.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      # Prisma's config needs a value to generate the client.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The browser smoke test. Needs the build above, since the server serves it.
      # Headless Chromium only. The runner already has its system libraries.
      - run: pnpm --filter @pr-peek/web exec playwright install --only-shell chromium
      - run: pnpm e2e
        env:
          E2E_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_e2e
