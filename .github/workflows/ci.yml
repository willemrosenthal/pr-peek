name: Build and browser test

# Format, lint, typecheck, and unit tests each have their own workflow, so a failure
# shows by name on the PR.

on:
  pull_request:
  # release.yml runs it on main, before releasing.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Pinned, since ubuntu-latest is moving to 26.04. 24.04 has what Chromium needs.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      # For the browser smoke test.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      # Prisma's config needs a value to generate the client.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build
      # The browser smoke test. Needs the build above, since the server serves it.
      # Headless Chromium only. The runner already has its system libraries.
      - run: pnpm --filter @pr-peek/web exec playwright install --only-shell chromium
      - run: pnpm e2e
        env:
          E2E_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_e2e
      # Open with `pnpm --filter @pr-peek/web exec playwright show-trace <file>`.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/e2e/test-results
          retention-days: 7
