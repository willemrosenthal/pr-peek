services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: prpeek
      POSTGRES_PASSWORD: prpeek
      POSTGRES_DB: prpeek
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prpeek"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
